const lines = DATA.lines.map((line, i) => ({ i: i, name: line[0], path: line[1] }));
const buses = DATA.buses.map((bus) => ({ name: bus[0], position: [bus[1], bus[2]] }));
const tipStyle = { fontFamily: "Arial", color: "white" };

const view = DATA.view;
const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
  center: [view.longitude, view.latitude],
  zoom: view.zoom,
  pitch: view.pitch,
  bearing: 0
});

let hour = 0;
const hourBox = document.getElementById("hour-box");

function layersForHour(h) {
  const rgb = DATA.rgb[h];
  const width = DATA.width[h];
  return [
    new deck.PathLayer({
      id: "linelayer",
      data: lines,
      getPath: (d) => d.path,
      getWidth: (d) => width[d.i],
      getColor: (d) => {
        const c = rgb[d.i];
        return [c[0], c[1], c[2], 255];
      },
      widthUnits: "meters",
      widthMinPixels: 4,
      widthMaxPixels: 8,
      pickable: true,
      updateTriggers: { getWidth: h, getColor: h }
    }),
    new deck.ScatterplotLayer({
      id: "buslayer",
      data: buses,
      getPosition: (d) => d.position,
      getFillColor: [0, 100, 255],
      getRadius: 500,
      radiusUnits: "meters",
      radiusMinPixels: 5,
      radiusMaxPixels: 20,
      filled: true,
      opacity: 0.9,
      pickable: true
    })
  ];
}

function getTooltip(info) {
  const object = info && info.object;
  const layer = info && info.layer;
  if (!object || !layer) return null;
  if (layer.id === "buslayer") {
    return { html: "Bus: " + object.name, style: tipStyle };
  }
  if (layer.id === "linelayer") {
    const luf = DATA.luf[hour][object.i];
    return {
      html: "Line: " + object.name + "<br>Utilisation: " + luf.toFixed(3) + "<br>",
      style: tipStyle
    };
  }
  return null;
}

// maplibre-gl 2.4.0 is WebGL1, so interleaved MapboxOverlay cannot paint.
const overlay = new deck.MapboxOverlay({
  interleaved: false,
  useDevicePixels: Math.min(window.devicePixelRatio || 1, 2),
  layers: layersForHour(hour),
  getTooltip: getTooltip
});
map.addControl(overlay);

function showHour(h) {
  hour = h;
  hourBox.textContent = "Current Hour:" + hour;
  overlay.setProps({ layers: layersForHour(hour) });
}

showHour(0);
setInterval(() => showHour((hour + 1) % DATA.rgb.length), 1000);
</script>
